<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Usuario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" rel="stylesheet" />
    <link href="css/styles.css" rel="stylesheet" />
</head>
    <body class="d-flex flex-column h-100 bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container px-3">
          <a class="navbar-brand fw-semibold" href="index.html">Eventos.uy</a>
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#nav"
            aria-controls="nav"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="nav">
            <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
              <li class="nav-item">
                <a class="nav-link" href="index.html">Inicio</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="about.html">Eventos</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="contact.html">Usuarios</a>
              </li>
              <li class="nav-item p-0">
                <a
                  class="btn btn-primary py-0 mt-2"
                  id="login/logout"
                  href="login.html"
                  >Iniciar sesión</a
                >
              </li>
            </ul>
          </div>
        </div>
      </nav>

        <div class="container mt-2 py-5">
            <div class="card mx-auto shadow" style="max-width: 600px;">
                <div class="card-header bg-white text-center">
                    <h2>Crea una cuenta</h2>
                </div>
                <div class="card-body p-4">
                    <form>
                        <div class="form-floating mb-3 text-muted">
                            <input type="text" class="form-control" id="nickname" placeholder="Nombre de usuario">
                            <label for="nickname">Nombre de usuario</label>
                        </div>
                        <div class="form-floating mb-3 text-muted">
                            <input type="text" class="form-control" id="nombre" placeholder="Nombre">
                            <label for="nombre">Nombre</label>
                        </div>
                        <div class="form-floating mb-3 text-muted">
                            <input type="text" class="form-control" id="correo" placeholder="Correo electrónico">
                            <label for="correo">Correo electrónico</label>
                        </div>
                        <div class="form-floating mb-3 text-muted">
                            <input type="password" class="form-control" id="password" placeholder="Contraseña">
                            <label for="password" class="form-label">Contraseña</label>
                        </div>
                        <div class="form-floating mb-3 text-muted">
                            <input type="password" class="form-control" id="confirmPassword" placeholder="Confirma tu contraseña">
                            <label for="confirmPassword" class="form-label">Confirmar Contraseña</label>
                        </div>

                        <p class="mb-3 text-muted">Rol <i class="bi bi-question-circle-fill ms-1"></i></p>

                        <div class="btn-group mb-3 w-100" role="group" aria-label="Basic radio toggle button group">
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="rol" id="btnRadioAsistente" autocomplete="off" checked>
                                <label class="form-check-label" for="btnRadioAsistente">Asistente</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="rol" id="btnRadioOrganizador" autocomplete="off">
                                <label class="form-check-label" for="btnRadioOrganizador">Organizador</label>
                            </div>
                        </div>
                        
                        <div class="asistente-campos" id="asistente">
                            <div class="mb-3 form-floating text-muted">
                                <input type="text" class="form-control" id="apellido" placeholder="Apellido">
                                <label for="apellido">Apellido</label>
                            </div>
                            <div class="mb-3">
                                <p>Fecha de nacimiento</p>
                                <div class ="row g-3">
                                    <div class="col-3">
                                    <select class="form-select" aria-label="Día" id="dia">
                                        <option selected>Día</option>
                                    </select>                                      
                                </div>
                                <div class="col-5">
                                    <select class="form-select" aria-label="Mes" id="mes">
                                        <option selected>Mes</option>
                                    </select>
                                </div>
                                <div class="col-4">
                                    <select class="form-select" aria-label="Año" id="anio">
                                        <option selected>Año</option>
                                    </select>
                                </div>  
                                </div>
                            </div>
                            <div class="mb-3">
                                <p>Institución (opcional)</p>
                                <select class="form-select" aria-label="Institución" id="institucion">
                                    <option selected>- Elección de institución -</option>
                                    <option value="1">Institución A</option>
                                    <option value="2">Institución B</option>
                                    <option value="3">Institución C</option>
                                    <option value="4">Institución D</option>
                                    <option value="5">Institución E</option>
                                </select>
                            </div>   
                        </div>

                        <div class="organizador-campos d-none" id="organizador">
                            <div class="mb-3 form-floating text-muted">
                                <input type="text" class="form-control" id="descripcion" placeholder="Descripción">
                                <label for="descripcion">Descripción</label>
                            </div>
                            <div class="mb-3 form-floating text-muted">
                                <input type="text" class="form-control" id="sitioWeb" placeholder="Sitio web (opcional)">
                                <label for="sitioWeb">Sitio web (opcional)</label>
                            </div>
                        </div>

                        <div>
                            <label for="formFile" class="form-label">Imagen (opcional)</label>
                            <input class="form-control" type="file" id="formFile" accept="image/*">
                        </div>

                        <button type="submit" class="btn btn-primary w-100 mt-5">Registrarse</button>
                        <p class="text-center mt-2"><a href="login.html" class="text-decoration-none">¿Ya tienes una cuenta? </a></p>
                    </form>
                </div>
        </div>
    <!-- Bootstrap core JS-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Core theme JS-->
    <script src="js/scripts.js"></script>
    <script src="js/pages/registroUsuario.js"></script>
</body>
</html>

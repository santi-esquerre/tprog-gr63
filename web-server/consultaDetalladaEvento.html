<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta Detallada de Edición</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" rel="stylesheet" />
    <!-- Core theme CSS (includes Bootstrap)-->
    <link href="css/styles.css" rel="stylesheet" />
    <link href="css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="d-flex flex-column h-100 bg-body-tertiary">
    <section class="position-relative" style="min-height: 500px; background-image: url('https://dummyimage.com/140x40/adb5bd/ffffff.png&text=IMM'); background-size: cover; background-position: center;">
        <div class="position-absolute bottom-0 start-0 w-100" style="height: 40%;background: linear-gradient(to top, rgba(0,0,0,0.7), transparent);">
            
            <div class="container h-100 d-flex flex-column justify-content-end pb-4">

                <h1 class="fw-bold text-white fs-2 fs-md-1" id="nombreEvento">Conferencia de Tecnología</h1>
                <p class="fs-5 fs-md-5 text-white mb-0 fw-bold" id="siglaEvento">CONFTEC</p>
            </div>
        </div>
    </section>
    <main class="flex-shrink-0 mt-5 mb-5">
        <div class="container p-5 rounded-4 border bg-body shadow-sm">
            <section class>
                <h3>Descripción </h3>
                <p class="fs-5 fs-md-5" id="descripcionEvento">Evento sobre innovación tecnológica</p>
            </section> 
        </div>

        <div class="container my-5">
            <div class="card shadow-sm">
                <div class="card-body row g-3 p-5 edicionesContainer">
                    <h3 class="mb-4">Ediciones</h3>

                    <div class="col-12 col-xxl-3 col-xl-4 col-md-6 col-12 edicionContainer">
                        <a class="text-decoration-none edicionLink" href="consultaDetalladaEdicion.html">
<div
                            class="card bg-body h-100 shadow-sm border-0"
                        ><img
                            class="card-img-top fotoEdicion"
                            src="https://dummyimage.com/600x350/ced4da/6c757d"
                            alt="Banner edición"
                            style="aspect-ratio: 600 / 350;"
                            />
                            <div class="card-body">
                                
                            <div
                                class="d-flex align-items-center justify-content-between flex-wrap"
                                >

                            <span class="text-muted siglaEdicion">CONFTECH26</span>
                                    <span class="badge bg-success estadoEdicion">Aceptada</span>
                            </div>
                            
                                    <div class="h5 card-title mb-2 nombreEdicion">
                                        Tecnología Punta del Este 2026
                                    </div>
                            <div class="mb-1">
                                <i class="bi bi-calendar-fill"></i>&nbsp;<span class="fechaEdicion"> 06/04/2026 -
                                10/04/2026</span> 
                            </div>
                            <div class="fw-semibold">
                                <i class="bi bi-geo-fill"></i><span class="ubicacionEdicion"> Punta del Este, Uruguay</span>
                            </div>
                        
                            </div>
                    </div>

                        </a>
                        
                </div>
                
            </div>  
            <div class="card-footer border-top-0">
                            <nav class="d-flex justify-content-center">
                                <ul class="pagination m-0">
                                    <li class="page-item disabled">
                                        <span class="page-link"><i class="bi bi-caret-left-fill"></i></span>
                                    </li>
                                    <li class="page-item active">
                                        <span class="page-link">1</span>
                                    </li>
                                    <li class="page-item">
                                        <a class="page-link" href="#"><i class="bi bi-caret-right-fill"></i></a>
                                    </li>
                                </ul>
                            </nav>
                </div> 
        </div>   
    </main>

    
    <script>
            const data = {
                1: {
                    "Nombre": "Conferencia de Tecnología",
                    "Descripcion": "Evento sobre innovación tecnológica",
                    "Sigla": "CONFTEC",
                    "FechaAlta": "10/01/2025",
                    "Categorias": ["Tecnología", "Innovación"],
                    "Ediciones" : [
                        {
                            "Id": 1,
                            "Sigla": "CONFTECH26",
                            "Nombre": "Tecnología Punta del Este 2026",
                            "FechaInicio": "06/04/2026",
                            "FechaFin": "10/04/2026",
                            "Ciudad": "Punta del Este",
                            "Pais": "Uruguay",
                            "Estado": "Aceptada",
                            "BannerURL": "https://dummyimage.com/600x350/ced4da/6c757d"
                        },
                        {
                            "Id": 2,
                            "Sigla": "MWC",
                            "Nombre": "Mobile World Congress 2025",
                            "FechaInicio": "12/12/2025",
                            "FechaFin": "15/12/2025",
                            "Ciudad": "Barcelona",
                            "Pais": "España",
                            "Estado": "Ingresada",
                            "BannerURL": "assets/img/IMG-EDEV09.png"
                        },
                        {
                            "Id": 3,
                            "Sigla": "WS26",
                            "Nombre": "Web Summit 2026",
                            "FechaInicio": "13/01/2026",
                            "FechaFin": "01/02/2026",
                            "Ciudad": "Lisboa",
                            "Pais": "Portugal",
                            "Estado": "Aceptada",
                            "BannerURL": "https://dummyimage.com/600x350/ced4da/6c757d"
                        }
                    ]
                },
                4: {
                    "Nombre": "Maratón de Montevideo",
                    "Descripcion": "Competencia deportiva anual en la capital",
                    "Sigla": "MARATON",
                    "FechaAlta": "01/01/2022",
                    "Categorias": ["Deporte", "Salud"],
                    "Ediciones" : [
                        {
                            "Id": 1,
                            "Sigla": "MARATON2022",
                            "Nombre": "Maratón de Montevideo 2022",
                            "FechaInicio": "14/09/2022",
                            "FechaFin": "14/09/2022",
                            "Ciudad": "Montevideo",
                            "Pais": "Uruguay",
                            "Estado": "Rechazada",
                            "BannerURL": "assets/img/IMG-EDEV03.jpeg"
                        },
                        {
                            "Id": 2,
                            "Sigla": "MARATON2024",
                            "Nombre": "Maratón de Montevideo 2024",
                            "FechaInicio": "14/09/2024",
                            "FechaFin": "14/09/2024",
                            "Ciudad": "Montevideo",
                            "Pais": "Uruguay",
                            "Estado": "Aceptada",
                            "BannerURL": "assets/img/IMG-EDEV04.jpeg"
                        }

                    ]
                }
            };

            estadoBgMap = {
                "Ingresada": "bg-secondary",
                "Aceptada": "bg-success",
                "Rechazada": "bg-danger"
            };

            const urlParams = new URLSearchParams(window.location.search);
            const eventId = urlParams.get('id');
            const eventData = data[eventId];
            
            document.getElementById('nombreEvento').textContent = eventData.Nombre;
            document.getElementById('descripcionEvento').textContent = eventData.Descripcion;
            document.getElementById('siglaEvento').textContent = eventData.Sigla;

            const edicionesContainer = document.querySelector('.edicionesContainer');
            const edicionTemplate = document.querySelector('.edicionContainer');

            edicionesContainer.innerHTML = '';

            eventData.Ediciones.forEach(edicion => {
                const edicionClone = edicionTemplate.cloneNode(true);
                edicionClone.querySelector('.nombreEdicion').textContent = edicion.Nombre;
                edicionClone.querySelector('.fechaEdicion').textContent = `${edicion.FechaInicio} - ${edicion.FechaFin}`;
                edicionClone.querySelector('.ubicacionEdicion').textContent = edicion.Ciudad + ", " + edicion.Pais;
                edicionClone.querySelector('.estadoEdicion').textContent = edicion.Estado;
                edicionClone.querySelector('.estadoEdicion').className = `badge ${estadoBgMap[edicion.Estado]} estadoEdicion`;
                edicionClone.querySelector('.fotoEdicion').src = edicion.BannerURL;
                edicionClone.querySelector('.siglaEdicion').textContent = edicion.Sigla;
                edicionClone.querySelector('.edicionLink').href = `consultaDetalladaEdicion.html?id=${edicion.Id}`;
                edicionesContainer.appendChild(edicionClone);
            });
    </script>
    <!-- Bootstrap core JS-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Core theme JS-->
    <script src="js/scripts.js"></script>

    
</body>
</html>
